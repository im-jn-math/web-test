function start(l){unlockAudio();round++;level=l;selected=draw(l);index=0;correct=0;score=0;hp=100;boss=100;history=[];show('game');$('monster').innerHTML=monsterSVG(!!level);$('monsterName').textContent=level?'深淵重甲巨獸':'星雲偵察首領';render()}
function render(){answered=false;let q=selected[index];$('stage').textContent=(level?'中等難度':'一般難度')+' · 第 '+(index+1)+'/5 題';$('points').textContent='得分 '+score;$('dots').innerHTML=Array.from({length:5},(_,i)=>`<span class="dot ${i<history.length?(history[i].ok?'good':'bad'):''}"></span>`).join('');$('story').textContent=index===4?'⚠ 最後一擊！請用畢氏定理突破敵人的防線。':'怡甄老師：觀察圖形，先找出直角與斜邊，再決定計算順序。';$('diagram').innerHTML=diagram(q);$('qtitle').textContent=q.prompt;$('choices').innerHTML=q.opts.map((v,i)=>`<button class="choice" onclick="answer(${i})">${'ABCD'[i]}. ${v}</button>`).join('');$('feedback').className='feedback hidden';$('teacherHint').classList.add('hidden');$('hintBtn').textContent='💡 請怡甄老師提示';$('hintBtn').disabled=false;$('nextBtn').classList.add('hidden');setBars()}
function setBars(){$('hpbar').style.width=hp+'%';$('bossbar').style.width=boss+'%';$('hptext').textContent=hp+'%';$('bosstext').textContent=boss+'%'}
function hint(){let q=selected[index];let messages={tri:'先找出直角與斜邊。如果要求斜邊，把兩股的平方相加；如果要求直角邊，就用斜邊平方減去另一股平方。',rect:'長方形的對角線會把長方形分成兩個直角三角形。先找出長與寬，再用畢氏定理。',ladder:'梯子、牆壁和地面組成直角三角形。梯子是斜邊，注意題目要求的是高度還是地面距離。',coords:'先求兩點的水平距離和垂直距離，把它們當成兩股，再利用畢氏定理。',double:'這是複合圖形！先拆成直角三角形，找到共用的邊或高，再處理題目要求的長度。'};let message=messages[q.shape]||'先確認直角的位置，分清楚兩股與斜邊；需要時把圖形拆成簡單的直角三角形。';$('teacherHintText').textContent=message;let card=$('teacherHint');card.classList.remove('hidden','hint-appear');void card.offsetWidth;card.classList.add('hint-appear');$('hintBtn').textContent='✓ 已顯示老師提示';$('hintBtn').disabled=true;}
function effects(ok){let arena=$('arena'),target=$(ok?'foe':'hero'),beam=$('laser');beam.className='laser '+(ok?'fire':'back');target.classList.remove('hit','monster-struck','hero-struck');void target.offsetWidth;target.classList.add(ok?'monster-struck':'hero-struck');$('flash').className='flash on';let t=document.createElement('div');t.className='hittext '+(ok?'enemy-damage':'hero-damage');t.textContent=ok?'首領受擊 −20%':'我方護盾 −20%';arena.appendChild(t);{let burst=document.createElement('div');burst.className=ok?'monster-impact':'hero-impact';burst.setAttribute('aria-hidden','true');arena.appendChild(burst);setTimeout(()=>burst.remove(),900)}for(let i=0;i<22;i++){let p=document.createElement('i'),theta=Math.random()*6.283,dist=35+Math.random()*95;p.className='particle';p.style.cssText=`left:${ok?76:23}%;top:48%;background:${ok?'#7cfaff':'#ff8bb3'};box-shadow:0 0 10px currentColor;--x:${Math.cos(theta)*dist}px;--y:${Math.sin(theta)*dist}px`;arena.appendChild(p);setTimeout(()=>p.remove(),850)}setTimeout(()=>{beam.className='laser';target.classList.remove('hit','monster-struck','hero-struck');$('flash').className='flash';t.remove()},1000);sfx(ok)}
function answer(choice){if(answered)return;unlockAudio();answered=true;let q=selected[index],ok=choice===q.answer;history.push({q,ok,choice});document.querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add('good');else if(i===choice)b.classList.add('bad')});if(ok){correct++;boss=Math.max(0,boss-20);score+=20}else{hp=Math.max(0,hp-20)}setBars();effects(ok);$('points').textContent='得分 '+score;$('hintBtn').disabled=true;$('feedback').className='feedback '+(ok?'':'wrong');$('feedback').innerHTML=`<strong>${ok?'✓ 答對！首領生命值減少 20% · +20 分':'✕ 答錯！護盾減少 20%'}</strong><div>${q.explain}</div>`;$('nextBtn').textContent=index===4?'查看戰績 →':'下一題 →';$('nextBtn').classList.remove('hidden');$('story').textContent=ok?'光束命中！首領能量持續下降。':'首領發動反擊！下題繼續努力。'}
function next(){if(!answered)return;if(index===4){finish();return}index++;render()}
const ranks=[['','航行見習生','重新整理觀念，下次一定能突破！'],['','星圖探索者','已經找到方向，繼續練習！'],['','銀河守衛','推理能力正在提升！'],['','星際菁英','距離完美任務只差一步！'],['','宇宙王牌','表現出色，首領幾乎無力反擊！'],['','傳說星際指揮官','完美五連勝！宇宙最耀眼的數學英雄！']];
function finish(){show('end');launchCelebration();let r=ranks[correct];$('endPanel').classList.toggle('golden',correct===5);$('endTitle').textContent=correct===5?'完美殲滅！星際救援成功':correct>=3?'任務完成！':'任務結束，整裝再出發';$('endScore').textContent=score+' 分';$('rank').textContent=r[1];$('endTalk').textContent='怡甄老師：'+r[2];$('review').innerHTML='<h3>本次戰鬥回顧</h3>'+history.map((h,i)=>`<details class="${h.ok?'review-correct':'review-incorrect'}"><summary>${h.ok?'✓':'✕'} 第 ${i+1} 題｜${h.q.prompt}</summary><div>正確答案：${h.q.ans}</div><div>${h.q.explain}</div></details>`).join('')}
function launchCelebration(){const panel=$('endPanel');panel.querySelectorAll('.celebration-particle').forEach(e=>e.remove());const count=correct===5?70:correct>=3?38:20;for(let i=0;i<count;i++){const p=document.createElement('i');p.className='celebration-particle';p.style.setProperty('--x',(Math.random()*100)+'%');p.style.setProperty('--dx',((Math.random()-.5)*210)+'px');p.style.setProperty('--dur',(2.2+Math.random()*2.6)+'s');p.style.setProperty('--delay',(Math.random()*1.8)+'s');p.style.setProperty('--hue',String(correct===5?35+Math.random()*28:170+Math.random()*110));panel.appendChild(p)}setTimeout(()=>panel.querySelectorAll('.celebration-particle').forEach(e=>e.remove()),6500)}
// 音樂只在第一次互動後啟動；重開關卡與結算均不停止，音量記住設定。
let ac=null,musicTimer=null,musicStep=0,volume=.4;try{let saved=localStorage.getItem('pythagoras_volume_v3');if(saved!==null)volume=Math.max(0,Math.min(1,Number(saved)/100))}catch(e){}$('vol').value=Math.round(volume*100);$('vol').addEventListener('input',e=>{volume=Number(e.target.value)/100;try{localStorage.setItem('pythagoras_volume_v3',String(Math.round(volume*100)))}catch(e){}unlockAudio()});function unlockAudio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();if(!musicTimer)musicTimer=setInterval(musicTick,310)}catch(e){}}document.addEventListener('pointerdown',unlockAudio,{once:true});
function tone(freq,duration=.16,type='sine',gain=.025,offset=0,end=1){if(!ac||volume===0)return;let t=ac.currentTime+offset,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(Math.max(30,freq),t);o.frequency.exponentialRampToValueAtTime(Math.max(30,freq*end),t+duration);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0001,gain*volume),t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+duration+.02)}function musicTick(){if(!ac||ac.state!=='running'||volume===0)return;let seq=[0,3,7,10,7,3,5,2,0,5,8,12,8,5,3,0],n=musicStep++;let root=147*Math.pow(2,seq[n%16]/12);tone(root,.23,'triangle',.017);if(n%2===0)tone(root*2,.16,'sine',.011,.04);if(n%4===0)tone(73.4,.42,'sawtooth',.009)}function sfx(ok){if(ok){[523,659,784,1046].forEach((f,i)=>tone(f,.17,'triangle',.065,i*.07));tone(550,.22,'sawtooth',.03,0,2)}else{tone(350,.3,'sawtooth',.08,0,.45);tone(160,.38,'square',.028,.12,.6)}}
const canvas=$('sky'),ctx=canvas.getContext('2d');let stars=[],w=0,h=0,frame=0;function resize(){let d=Math.min(devicePixelRatio||1,2);w=canvas.width=Math.round(innerWidth*d);h=canvas.height=Math.round(innerHeight*d);stars=Array.from({length:Math.min(130,Math.floor(innerWidth*innerHeight/4500))},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.6*d+.4,s:Math.random()*.6*d+.2,p:Math.random()*7}))}addEventListener('resize',resize);resize();function animate(){frame++;ctx.clearRect(0,0,w,h);for(let s of stars){s.y+=s.s;if(s.y>h){s.y=0;s.x=Math.random()*w}ctx.globalAlpha=.35+.55*(.5+.5*Math.sin(frame*.025+s.p));ctx.fillStyle='#bfefff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}ctx.globalAlpha=1;requestAnimationFrame(animate)}animate();
